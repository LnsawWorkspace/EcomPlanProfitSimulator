description: |
  帮你算清楚"卖一件商品到底能赚多少钱"（理论/理想情况下的单品利润计算）。
  适用：国内电商（拼多多/京东/淘宝/抖音）、跨境电商、外卖商家等——只要你是卖货的，想知道"这个品按这个价卖、这个推广投入、这个退款率，赚不赚、赚多少、保本点在哪"，就能用。
  用法：@ 本 Skill 后直接问 AI"这个 Skill 能帮我做什么？"，或直接说需求（如"算一下售价 99、成本 68、退款率 8% 的利润"），AI 会带你走完整流程。
  核心能力（针对"全场景单品推演"网站）：
  ① 数据空间/方案组/方案/参数一站式管理（新建、切换、维护）；
  ② 利润报告深度解读（13 项核心指标、3 张明细表、盈亏诊断）；
  ③ 6 张敏感性分析图（ROI/售价/单量曲线 + 三张双变量热力图），自动计算保本点、盈利占比、利润极值；
  ④ 方案调优闭环：报告+分析图定位病灶 → 调整售价/退款/ROI → 验证资本回报率，附运营红线建议。
  注意：当前为测试版（β），部分功能仍在迭代；推演数字为理论/理想情况，供决策参考，正式投入请以实际业务验证为准。

permissions:
  - 读写浏览器 IndexedDB（目标站点内的数据空间、方案、参数数据）
  - 控制本地浏览器（通过 CDP 端口驱动页面完成操作与读取）
  - 写入本地截图文件（报告与分析图存档）
  note: 本技能不收集、不上传任何用户数据；所有操作仅针对目标站点；不修改站点源码。
